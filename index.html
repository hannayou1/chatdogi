<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#110e19">
  <title>챗도지 — 별이 건네는 이야기</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600&display=swap");

    :root {
      color-scheme: dark;
      --bg: #110e19;
      --text: #f1e9df;
      --muted: #a49aa9;
      --gold: #d9bb89;
      --line: rgba(217, 187, 137, .18);
      --serif: "Gowun Batang", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: wait; }

    button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 5px;
    }

    /* Atmospheric background */
    .atmosphere {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 48% 12%, #62415d38, transparent 53%),
        radial-gradient(ellipse at 0% 75%, #38305222, transparent 40%),
        radial-gradient(ellipse at 100% 90%, #75513e14, transparent 40%);
    }

    .atmosphere::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .55;
      background-image:
        radial-gradient(1px 1px at 17% 21%, #f0d8ac 99%, transparent),
        radial-gradient(1px 1px at 74% 17%, #f0d8ac 99%, transparent),
        radial-gradient(1px 1px at 87% 63%, #f0d8ac 99%, transparent),
        radial-gradient(1px 1px at 31% 78%, #f0d8ac 99%, transparent);
      background-size: 410px 390px;
    }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      max-width: 1440px;
      height: 100dvh;
      margin: auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 20px;
      margin: 0 48px;
      padding: 25px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 37px;
      height: 37px;
      color: var(--gold);
      border: 1px solid #d9bb8940;
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 25px;
    }

    .brand-name {
      margin: 0;
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .brand-caption {
      display: block;
      margin-top: 4px;
      color: #ad977c;
      font-size: 8px;
      letter-spacing: 2.6px;
    }

    .header-note {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .4px;
    }

    .header-note span {
      margin-right: 9px;
      color: var(--gold);
    }

    /* Scrollable conversation */
    .main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 24px 20px;
      scrollbar-width: thin;
      scrollbar-color: #4a394d transparent;
    }

    .content {
      width: min(720px, 100%);
      margin: auto;
    }

    .hero {
      padding: 34px 0 30px;
      text-align: center;
    }

    .celestial {
      display: block;
      width: 160px;
      height: 160px;
      margin: 0 auto 16px;
      overflow: visible;
      color: var(--gold);
      filter: drop-shadow(0 0 25px #d9bb8912);
    }

    .orbit {
      transform-origin: 100px 100px;
      animation: orbit 120s linear infinite;
    }

    .eyebrow {
      margin: 0;
      color: #b79b77;
      font-size: 9px;
      letter-spacing: 3.7px;
    }

    .hero h2 {
      margin: 17px 0 14px;
      font-family: var(--serif);
      font-size: clamp(29px, 4.5vw, 42px);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: -1.3px;
    }

    .hero h2 em {
      color: #dec39f;
      font-style: normal;
    }

    .hero-description {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.95;
    }

    /* Tarot-inspired question cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      width: min(560px, 100%);
      margin: 29px auto 0;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 139px;
      padding: 21px 8px 17px;
      overflow: hidden;
      border: 1px solid #d9bb8930;
      border-radius: 58px 58px 10px 10px;
      background: linear-gradient(150deg, #38273799, #20192399);
      color: var(--text);
      transition: transform .25s, border-color .25s, background .25s;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid #d9bb8913;
      border-radius: 53px 53px 6px 6px;
      pointer-events: none;
    }

    .card:hover:not(:disabled) {
      transform: translateY(-5px);
      border-color: #d9bb8980;
      background: linear-gradient(150deg, #51384d99, #2a202d);
    }

    .card-number {
      color: #a38a71;
      font-family: Georgia, serif;
      font-size: 8px;
      letter-spacing: 2px;
    }

    .card svg {
      width: 31px;
      height: 31px;
      margin: 12px 0 10px;
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-title { font-size: 11px; }

    .card-caption {
      margin-top: 5px;
      color: #9f8c9d;
      font-family: Georgia, serif;
      font-size: 8px;
      letter-spacing: 1px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 0 25px;
      color: #b49876;
      font-size: 9px;
      letter-spacing: 2px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d9bb892b);
    }

    .divider::after { transform: rotate(180deg); }

    /* Messages */
    .message {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 23px;
      animation: appear .3s ease-out;
    }

    .avatar {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border: 1px solid #d9bb8935;
      border-radius: 50%;
      background: #2c202e;
      color: var(--gold);
      font-size: 20px;
    }

    .message-content { min-width: 0; max-width: 85%; }

    .sender {
      margin: 0 0 8px 2px;
      color: #c4ad95;
      font-size: 10px;
    }

    .sender span {
      margin-left: 7px;
      color: #8f8194;
      font-size: 9px;
    }

    .bubble {
      padding: 17px 20px;
      border: 1px solid #d9bb8917;
      border-radius: 2px 16px 16px;
      background: linear-gradient(120deg, #302331a6, #211b29a6);
      color: #ded4df;
      font-size: 13px;
      line-height: 1.95;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user { justify-content: flex-end; }

    .user .bubble {
      border-color: #cfadc22b;
      border-radius: 16px 2px 16px 16px;
      background: linear-gradient(120deg, #61445c, #49364f);
      color: #fff1f2;
    }

    .loading .bubble {
      color: #bcabbf;
      animation: pulse 1.7s ease-in-out infinite;
    }

    .error .bubble {
      border-color: #efaaa633;
      color: #efbcb8;
    }

    /* Composer */
    .footer {
      flex-shrink: 0;
      width: min(768px, 100%);
      margin: auto;
      padding: 12px 24px 19px;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 9px;
      border: 1px solid #d9bb8940;
      border-radius: 17px;
      background: #241c2bdd;
      box-shadow: 0 10px 45px #00000025, inset 0 1px 0 #ffffff05;
      backdrop-filter: blur(16px);
      transition: border-color .2s, box-shadow .2s;
    }

    .composer:focus-within {
      border-color: #d9bb8980;
      box-shadow: 0 0 0 3px #d9bb8907;
    }

    textarea {
      flex: 1;
      min-width: 0;
      height: 46px;
      max-height: 140px;
      padding: 12px 10px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      line-height: 22px;
    }

    textarea::placeholder { color: #95869c; }

    .send {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border: 1px solid #f8dfb54d;
      border-radius: 12px;
      background: linear-gradient(140deg, #e7cda4, #c19b69);
      color: #392b37;
      transition: filter .2s;
    }

    .send:hover:not(:disabled) { filter: brightness(1.12); }

    .footnote {
      margin: 11px 0 0;
      color: #8f8195;
      text-align: center;
      font-size: 10px;
      line-height: 1.7;
    }

    .footnote span { margin-right: 5px; color: #b59b78; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .45; } }
    @keyframes appear {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 1100px) {
      .app::before, .app::after {
        position: absolute;
        top: 46%;
        color: #d9bb8940;
        font-family: var(--serif);
        font-size: 10px;
        letter-spacing: 5px;
        writing-mode: vertical-rl;
      }

      .app::before { content: "TRUST YOUR OWN UNIVERSE"; left: 51px; }
      .app::after { content: "A LITTLE WONDER, EVERY DAY"; right: 51px; }
    }

    @media (max-width: 600px) {
      .header { margin-inline: 20px; padding-block: 18px; }
      .brand-name { font-size: 17px; }
      .header-note { font-size: 0; }
      .header-note span { font-size: 16px; margin: 0; }
      .main { padding-inline: 20px; }
      .hero { padding-top: 24px; }
      .celestial { width: 125px; height: 125px; margin-bottom: 13px; }
      .eyebrow { font-size: 8px; letter-spacing: 2.5px; }
      .hero-description { font-size: 11px; }
      .cards { gap: 8px; margin-top: 25px; }
      .card { min-height: 127px; padding-top: 19px; }
      .card svg { width: 26px; height: 26px; }
      .card-title { font-size: 10px; }
      .card-caption { font-size: 7px; letter-spacing: .5px; }
      .message { gap: 9px; }
      .message-content { max-width: 87%; }
      .bubble { padding: 14px 16px; font-size: 12px; }
      .footer { padding: 10px 16px 14px; }
      .footnote { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">☾</div>
        <div>
          <h1 class="brand-name">운세보는 챗도지</h1>
          <span class="brand-caption">THE MOONLIT ORACLE</span>
        </div>
      </div>

      <div class="header-note">
        <span aria-hidden="true">✧</span> 서버 없는 무료 체험
      </div>
    </header>

    <main id="chatScroll" class="main">
      <div class="content">
        <section class="hero" aria-labelledby="heroTitle">
          <svg class="celestial" viewBox="0 0 200 200"
               fill="none" aria-hidden="true">
            <circle cx="100" cy="100" r="86"
                    stroke="currentColor" stroke-opacity=".18"/>
            <circle cx="100" cy="100" r="72"
                    stroke="currentColor" stroke-opacity=".12"/>
            <g class="orbit" stroke="currentColor">
              <ellipse cx="100" cy="100" rx="86" ry="33"
                       transform="rotate(-35 100 100)" stroke-opacity=".28"/>
              <circle cx="170" cy="50" r="3" fill="currentColor"
                      stroke="none"/>
            </g>
            <path d="M113 57a46 46 0 1 0 29 72
                     A49 49 0 0 1 113 57Z"
                  fill="currentColor" fill-opacity=".1"
                  stroke="currentColor" stroke-width="1.2"/>
            <path d="m135 65 2.5 8.5L146 76l-8.5 2.5L135 87
                     l-2.5-8.5L124 76l8.5-2.5Z"
                  fill="currentColor" fill-opacity=".85"/>
            <path d="M100 9v10M95 14h10M100 181v10M95 186h10
                     M9 100h10M14 95v10M181 100h10M186 95v10"
                  stroke="currentColor" stroke-opacity=".6"/>
            <circle cx="66" cy="138" r="2" fill="currentColor"/>
            <circle cx="152" cy="110" r="1.5" fill="currentColor"/>
          </svg>

          <p class="eyebrow">LET THE UNIVERSE WHISPER</p>

          <h2 id="heroTitle">
            당신의 오늘에,<br>
            <em>별빛 한 조각을.</em>
          </h2>

          <p class="hero-description">
            마음에 맴도는 질문을 조용히 꺼내보세요.<br>
            질문을 보내면 준비된 테스트 답변을 보여드려요.
          </p>

          <div class="cards" aria-label="운세 질문 선택">
            <button class="card" type="button"
                    data-question="오늘의 운세를 알려줘">
              <span class="card-number">I</span>
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="16" r="6"/>
                <path d="M16 2v4m0 20v4M2 16h4m20 0h4
                         M6 6l3 3m14 14 3 3M6 26l3-3M23 9l3-3"/>
              </svg>
              <span class="card-title">오늘의 운세</span>
              <span class="card-caption">THE SUN</span>
            </button>

            <button class="card" type="button"
                    data-question="오늘의 연애운을 알려줘">
              <span class="card-number">II</span>
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="M16 27S3 19 3 11a7 7 0 0 1 13-3
                         7 7 0 0 1 13 3c0 8-13 16-13 16Z"/>
                <path d="M16 11v10m-5-5h10" stroke-opacity=".45"/>
              </svg>
              <span class="card-title">사랑의 흐름</span>
              <span class="card-caption">THE LOVERS</span>
            </button>

            <button class="card" type="button"
                    data-question="오늘의 금전운을 알려줘">
              <span class="card-number">III</span>
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="m16 3 12 13-12 13L4 16 16 3Z"/>
                <path d="m16 9 6 7-6 7-6-7 6-7ZM16 3v6m12 7h-6
                         M16 23v6M4 16h6"/>
              </svg>
              <span class="card-title">재물의 기운</span>
              <span class="card-caption">THE STAR</span>
            </button>

            <button class="card" type="button"
                    data-question="오늘의 직장운과 새로운 기회를 알려줘">
              <span class="card-number">IV</span>
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="M5 28V15a11 11 0 0 1 22 0v13M2 28h28"/>
                <path d="M10 28V15a6 6 0 0 1 12 0v13M16 14v8
                         m-3-3 3 3 3-3"/>
              </svg>
              <span class="card-title">새로운 길</span>
              <span class="card-caption">THE WORLD</span>
            </button>
          </div>
        </section>

        <div class="divider" aria-hidden="true">✧ &nbsp; YOUR READING &nbsp; ✧</div>

        <div id="messages" role="log" aria-label="운세 대화"
             aria-live="polite" aria-relevant="additions text">
          <div class="message assistant">
            <div class="avatar" aria-hidden="true">✧</div>
            <div class="message-content">
              <p class="sender">챗도지 <span>별빛 안내자</span></p>
              <div class="bubble">잘 오셨어요. 잠시 일상의 소음을 내려놓아도 좋아요.

오늘의 작은 궁금증부터 마음속 깊은 바람까지,
지금 당신은 어떤 이야기가 궁금한가요?</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <form id="chatForm" class="composer">
        <label class="sr-only" for="question">운세 질문</label>
        <textarea id="question" rows="1" maxlength="2000"
                  placeholder="당신의 이야기를 들려주세요…"
                  enterkeyhint="send"></textarea>

        <button id="requestButton" class="send"
                type="submit" aria-label="질문 보내기">
          <svg width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="m12 4 7 8h-5v8h-4v-8H5l7-8Z"/>
          </svg>
        </button>
      </form>

      <p class="footnote">
        <span aria-hidden="true">✦</span>
        운세는 가벼운 힌트로 참고해주세요. 내일을 만들어가는 건 당신이에요.
      </p>
      <p id="requestStatus" class="sr-only" role="status"></p>
    </footer>
  </div>
<script>
const form = document.querySelector('#chatForm');
const input = document.querySelector('#question');
const send = document.querySelector('#requestButton');
const messages = document.querySelector('#messages');
const scrollArea = document.querySelector('#chatScroll');
const status = document.querySelector('#requestStatus');
const cards = document.querySelectorAll('.card');
let busy = false;

function scrollToLatest() {
  scrollArea.scrollTop = scrollArea.scrollHeight;
}
function resizeInput() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}
function addMessage(role, text, state = '') {
  const row = document.createElement('div');
  row.className = 'message ' + role + (state ? ' ' + state : '');
  if (role === 'assistant') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '✧';
    avatar.setAttribute('aria-hidden', 'true');
    row.append(avatar);
  }
  const content = document.createElement('div');
  content.className = 'message-content';
  const sender = document.createElement('p');
  sender.className = 'sender';
  sender.textContent = role === 'user' ? '나' : '챗도지';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  content.append(sender, bubble);
  row.append(content);
  messages.append(row);
  scrollToLatest();
  return row;
}
// 서버나 API 없이 브라우저에서 예시 답변을 만듭니다.
async function requestReply(question) {
  await new Promise(resolve => setTimeout(resolve, 800));
  let answer;
  if (/연애|사랑|결혼|애인|짝사랑/.test(question)) {
    answer = '💕 사랑의 흐름\n\n오늘은 상대방의 이야기를 차분히 들어보세요. 따뜻한 말 한마디가 편안한 대화의 시작이 될 수 있어요.\n\n먼저 가벼운 안부를 전해보는 건 어떨까요?';
  } else if (/금전|재물|돈|투자|재테크/.test(question)) {
    answer = '✨ 재물의 기운\n\n오늘은 작은 지출부터 돌아보는 시간을 가져보세요. 필요한 것과 갖고 싶은 것을 나눠 적어보면 마음도 한결 가벼워질 거예요.\n\n금전적인 결정은 운세 대신 실제 정보와 자신의 상황을 기준으로 판단해주세요.';
  } else if (/직장|취업|사업|일자리|기회|이직/.test(question)) {
    answer = '🌟 새로운 길\n\n크게 서두르기보다 작은 목표 하나를 마무리해보세요. 지금까지 해온 일을 정리하면 다음에 무엇을 하고 싶은지도 조금 더 선명해질 수 있어요.\n\n오늘의 작은 실천이 새로운 시작의 계기가 될 수 있어요.';
  } else if (/건강|몸|피곤|휴식/.test(question)) {
    answer = '🌿 나를 돌보는 시간\n\n잠시 쉬면서 몸과 마음의 상태를 살펴보세요. 무리하지 않고 편안한 일정을 잡아보는 것도 좋겠어요.\n\n건강에 대한 걱정이나 증상이 있다면 운세가 아닌 의료 전문가의 도움을 받아주세요.';
  } else {
    answer = '🌙 오늘의 작은 힌트\n\n당신의 속도로 하루를 시작해보세요. 해야 할 일 중 가장 작은 것 하나를 끝내고, 스스로에게 따뜻한 말 한마디를 건네보는 건 어떨까요?\n\n오늘을 만들어가는 힘은 당신의 선택 안에 있어요.';
  }
  return answer + '\n\n※ 테스트용으로 준비된 예시 답변입니다. 실제 AI나 운세 분석 결과가 아닙니다.';
}
async function submitQuestion(event) {
  event.preventDefault();
  if (busy) return;
  const question = input.value.trim();
  if (!question || question.length > 2000) {
    status.textContent = '질문을 1~2,000자 이내로 입력해주세요.';
    input.focus();
    return;
  }
  busy = true;
  send.disabled = true;
  cards.forEach(card => { card.disabled = true; });
  input.value = '';
  resizeInput();
  addMessage('user', question);
  const pending = addMessage('assistant', '별의 이야기를 읽고 있어요…', 'loading');
  status.textContent = '답변을 기다리고 있습니다.';
  try {
    const reply = await requestReply(question);
    pending.remove();
    addMessage('assistant', reply);
    status.textContent = '답변이 도착했습니다.';
  } catch (error) {
    pending.remove();
    // 답변을 기다리는 동안 새로 작성한 내용이 있으면 보존합니다.
    if (!input.value.trim()) input.value = question;
    resizeInput();
    const message = error.name === 'AbortError'
      ? '응답 시간이 초과되었습니다. 잠시 후 다시 보내주세요.'
      : error instanceof TypeError
        ? '답변을 표시하지 못했습니다. 다시 시도해주세요.'
        : error.message;
    addMessage('assistant', message, 'error');
    status.textContent = message;
  } finally {
    busy = false;
    send.disabled = false;
    cards.forEach(card => { card.disabled = false; });
    input.focus();
  }
}
form.addEventListener('submit', submitQuestion);
input.addEventListener('input', resizeInput);
input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    form.requestSubmit();
  }
});
cards.forEach(card => card.addEventListener('click', () => {
  if (busy) return;
  input.value = card.dataset.question;
  resizeInput();
  form.requestSubmit();
}));
</script>
